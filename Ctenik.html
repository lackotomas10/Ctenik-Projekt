<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Čteník</title>
    <link rel="shortcut icon" href="img/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="Nadpis">ČTENÍK</h1> <img id="Profil" src="img/Logo.png" >

    </header>
    <main>
        <div class="VelkýBlok">
            <div class="malýBlok" id="Přehled">
                <h2>Přehled</h2>
                <h3 id="PočKnih">Přečtené knihy:</h3>
                <h3 id="řada">Dny v řadě:</h3>
            </div>
            <div class="malýBlok" id="Statistiky">
                <h2>Statistiky:</h2>
                <h3>Minuty čtení:</h3>
                <canvas id="Graf"></canvas> <!-- Dodělat graf čtení za poslední týden -->
            </div>
            <div class="malýBlok" id="Přispět">
                <h2>Záznam</h2>
                <div id="Dotazník">
                    <h3>Datum</h3>
                    <input type="date"> <!-- Dodělat v js, dnešní datum -->
                    <h3>Počet minut</h3>
                    <input type="number" value="30"><p>  <!-- Kontrola uživatelského vstupu -->
                    <h3>Dočtení knihy</h3>
                    <input type="checkbox">
                </div>
                <button>Zaznamenat</button>

            </div>
        </div>
    </main>
    <footer>
        <nav>
            <div class="Odkaz">
                <a href="Ctenik.html">
                    <img src="img/Dům.png" class="OdkazObr">
                    <h3>Domovská stránka</h3>
                </a>
            </div>
            <div class="Odkaz">
                <a href="">
                    <img src="img/Trofej.png" class="OdkazObr">
                    <h3>Soutěž</h3>
                </a>
            </div>
        </nav>
    </footer>
    
</body>
</html>
